name: Deploy BenDewey.com to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bendewey-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish site
        run: dotnet publish src/BenDewey.Web/BenDewey.Web.csproj --configuration Release --output ./publish

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy site
        uses: azure/webapps-deploy@v3
        with:
          app-name: bendewey-blog
          package: ./publish

      - name: Check deployed site
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 https://bendewey-blog.azurewebsites.net/projects > /dev/null
